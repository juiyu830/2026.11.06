<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>日常｜個人行程與任務</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f6f4ef;--paper:#fffefa;--ink:#20251f;--muted:#8a8e83;--line:#e9e7df;--green:#385b4a;--green2:#e9f0e8;--lime:#c6da8a;--orange:#ee9a6d;--shadow:0 12px 40px #293b2410;--radius:20px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans','Noto Sans TC',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a8c38b;outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:246px minmax(420px,1fr) 330px;max-width:1600px;margin:auto;padding:22px;gap:22px}.sidebar,.panel,.main{min-width:0}.sidebar{padding:18px 12px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 36px;font-size:19px;font-weight:700;letter-spacing:-.5px}.brand-mark{width:34px;height:34px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:18px}.brand span:last-child{font-size:10px;color:#9ca198;letter-spacing:1.6px;font-weight:600;display:block;margin-top:1px}.nav-label{font-size:10px;letter-spacing:1.4px;color:#a2a398;font-weight:700;padding:0 13px;margin:8px 0 10px}.nav-btn{border:0;background:transparent;color:#777d73;padding:11px 13px;border-radius:12px;display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:3px;transition:.2s}.nav-btn:hover{background:#eeede7}.nav-btn.active{background:var(--green2);color:var(--green);font-weight:600}.nav-btn .ico{width:18px;text-align:center;font-size:16px}.nav-count{margin-left:auto;background:#dbe7d8;color:var(--green);border-radius:20px;padding:2px 7px;font-size:10px}.side-bottom{margin-top:auto}.week-card{margin:12px 4px 18px;background:#e9eee3;border-radius:18px;padding:17px}.week-card .eyebrow{font-size:10px;letter-spacing:1px;color:#798673}.week-card strong{display:block;font-size:24px;margin-top:8px}.week-card small{color:#7b8375}.profile{padding:14px 10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:11px}.avatar{width:36px;height:36px;border-radius:50%;background:#e8c3a7;color:#714932;display:grid;place-items:center;font-weight:700}.profile strong{font-size:12px}.profile small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.main{padding:13px 6px}.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 34px}.breadcrumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn,.soft-btn{border:1px solid var(--line);background:var(--paper);border-radius:11px;color:var(--ink);height:38px;padding:0 12px}.icon-btn{width:38px;padding:0}.icon-btn:hover,.soft-btn:hover{background:#f1f3ec}.date-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.date-heading h1{font-size:30px;letter-spacing:-1.2px;margin:0 0 7px}.date-heading p{color:var(--muted);margin:0;font-size:12px}.today-chip{font-size:10px;border-radius:20px;padding:7px 11px;background:#e7eee1;color:#49644c}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section-head h2{font-size:14px;margin:0;font-weight:700}.section-head small{color:var(--muted);font-size:11px}.quick-add{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:20px;box-shadow:0 3px 12px #17250d05}.plus{border:0;background:var(--green);color:white;width:25px;height:25px;border-radius:8px;font-size:19px;line-height:1}.quick-add input{border:0;background:transparent;outline:0;flex:1;min-width:0;color:var(--ink)}.quick-add input::placeholder{color:#a0a197}.quick-add .add-hint{font-size:10px;color:#a0a197}.filter-row{display:flex;gap:6px;margin:0 0 15px}.filter{border:0;background:transparent;color:#888d82;padding:7px 11px;border-radius:9px;font-size:11px}.filter.active{background:#e9eee3;color:var(--green);font-weight:600}.task-list{display:flex;flex-direction:column;gap:8px}.task{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid #eeece5;border-radius:14px;padding:13px 14px;min-height:60px;transition:.18s}.task:hover{box-shadow:0 5px 18px #25391b0a;transform:translateY(-1px)}.check{width:19px;height:19px;border:1.5px solid #c8ccc0;border-radius:6px;flex:none;display:grid;place-items:center;color:white;background:transparent;padding:0}.check:hover{border-color:var(--green)}.task-body{flex:1;min-width:0}.task-title{font-size:12px;font-weight:600}.task-meta{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:10px;margin-top:5px}.task.done .task-title{text-decoration:line-through;color:#a6aaa0}.task.done .check{background:var(--green);border-color:var(--green)}.task.done .check:after{content:'✓';font-size:12px}.due{color:#b87450}.overdue{color:#c45b4d}.carry{background:#f2eee5;color:#89785d;padding:3px 6px;border-radius:5px;font-size:9px}.task-tools{display:flex;align-items:center;gap:7px}.tag{font-size:9px;color:#72836e;background:#eef2e8;padding:5px 8px;border-radius:6px}.more{border:0;background:transparent;color:#a5a79e;font-size:17px;padding:3px}.divider-label{font-size:10px;color:#a1a398;letter-spacing:.7px;font-weight:700;margin:22px 0 10px}.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px;background:#ffffff75;border-radius:14px}.panel{padding:12px 4px 10px 0}.calendar-card,.reminder-card,.tip-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.calendar-card{padding:21px 18px 18px}.calendar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px}.calendar-top h2{margin:0;font-size:14px}.month-arrows{display:flex;gap:4px}.month-arrows button{border:0;background:transparent;width:27px;height:27px;border-radius:8px;color:#697467}.month-arrows button:hover{background:var(--green2)}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.weekdays{color:#a1a398;font-size:9px;margin-bottom:8px}.day{height:37px;display:grid;place-items:center;font-size:11px;color:#555b51;position:relative;border:0;background:transparent;border-radius:50%;width:36px;margin:auto}.day:hover{background:#f0f1eb}.day.other{color:#c3c4bd}.day.selected{background:var(--green);color:white;font-weight:700}.day.today:not(.selected){color:var(--green);font-weight:700;border:1px solid #adc09e}.day.has-event:after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:var(--orange);bottom:3px}.day.selected.has-event:after{background:var(--lime)}.calendar-legend{display:flex;gap:15px;border-top:1px solid var(--line);padding-top:13px;margin-top:13px;font-size:9px;color:#898e83}.legend-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-right:5px;vertical-align:1px}.reminder-card{margin-top:14px;padding:17px 18px}.reminder-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.reminder-head strong{font-size:12px}.bell{width:28px;height:28px;background:#f5eee5;color:#b87c51;border-radius:9px;display:grid;place-items:center}.reminder-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid #f0eee8}.reminder-icon{font-size:13px;margin-top:1px}.reminder-item strong{font-size:10px;display:block}.reminder-item small{font-size:9px;color:var(--muted);display:block;margin-top:4px}.tip-card{margin-top:14px;background:#edf1e7;border:0;padding:17px 18px;box-shadow:none}.tip-card strong{font-size:11px;color:#486247}.tip-card p{font-size:10px;line-height:1.7;color:#747e6e;margin:8px 0 0}.modal-backdrop{position:fixed;inset:0;background:#1b241c66;z-index:5;display:grid;place-items:center;padding:20px}.modal-backdrop[hidden]{display:none!important}.modal{width:min(460px,100%);background:var(--paper);border-radius:20px;padding:25px;box-shadow:0 24px 80px #1b251d33}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:18px}.close{border:0;background:#f2f1eb;border-radius:9px;width:32px;height:32px}.field{margin:13px 0}.field label{display:block;color:#6f746b;font-size:10px;font-weight:600;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:white;padding:11px;color:var(--ink)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;font-size:11px;color:#555b51}.switch{appearance:none;width:36px;height:20px;border-radius:20px;background:#d9dbd3;position:relative;cursor:pointer;transition:.2s}.switch:checked{background:var(--green)}.switch:after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:white;left:3px;top:3px;transition:.2s}.switch:checked:after{left:19px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.btn{border:0;border-radius:10px;padding:10px 16px;font-size:11px}.btn.secondary{background:#f0efe9;color:#5c6258}.btn.primary{background:var(--green);color:white}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#25392f;color:white;border-radius:11px;padding:11px 16px;font-size:11px;transition:.25s;z-index:8;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.view-switch{display:flex;background:#eeede7;border-radius:10px;padding:3px}.view-switch button{border:0;background:transparent;border-radius:8px;padding:6px 9px;color:#85897f;font-size:10px}.view-switch button.active{background:white;color:var(--green);box-shadow:0 2px 5px #0000000c}
    @media(max-width:1160px){.app{grid-template-columns:205px minmax(380px,1fr);padding:16px;gap:16px}.panel{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0}.calendar-card{grid-row:span 2}.reminder-card,.tip-card{margin:0}.sidebar{grid-row:span 2}}
    @media(max-width:760px){.app{display:block;padding:12px}.sidebar{padding:5px 2px 13px;display:block}.brand{padding:3px 7px 13px}.nav-label,.side-bottom{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav-btn{white-space:nowrap;padding:9px 11px;margin:0;font-size:11px}.main{padding:7px 2px}.topbar{margin:0 0 23px}.date-heading h1{font-size:25px}.panel{display:block;padding:12px 0}.reminder-card,.tip-card{margin-top:12px}.calendar-card{padding:18px}.task{padding:12px}.task-tools .tag{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">✳</div><div>日常<span>DAYLIGHT PLANNER</span></div></div>
    <div class="nav-label">工作空間</div>
    <nav class="nav" aria-label="主要導覽">
      <button class="nav-btn active" data-page="today"><span class="ico">◷</span>今天 <span class="nav-count" id="todayCount">0</span></button>
      <button class="nav-btn" data-page="calendar"><span class="ico">▦</span>行事曆</button>
      <button class="nav-btn" data-page="all"><span class="ico">☷</span>所有待辦</button>
    </nav>
    <div class="side-bottom"><div class="week-card"><div class="eyebrow">本週完成</div><strong><span id="weekDone">0</span><small> / <span id="weekTotal">0</span></small></strong><small>慢慢來，也在前進 🌱</small></div><div class="profile"><div class="avatar">你</div><div><strong>我的日常</strong><small>留一點空間給自己</small></div></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="breadcrumb">我的空間　/　<span id="crumb">今天</span></div><div class="top-actions"><button class="icon-btn" id="notifyBtn" title="啟用系統通知" aria-label="啟用系統通知">♧</button><button class="soft-btn" id="newEventBtn">＋ 新增活動</button></div></header>
    <section class="date-heading"><div><h1 id="pageTitle">今天，慢慢來。</h1><p id="dateText"></p></div><div class="view-switch" id="viewSwitch"><button class="active" data-view="tasks">待辦</button><button data-view="calendar">日曆</button></div></section>
    <section id="taskView">
      <div class="section-head"><h2 id="taskSectionTitle">今天的待辦</h2><small id="taskSummary">把事情一件件完成就好</small></div>
      <form class="quick-add" id="quickForm"><button class="plus" type="submit" aria-label="快速新增">+</button><input id="quickInput" placeholder="記下一件待辦… 按 Enter 快速新增" aria-label="新增待辦事項"><button class="add-hint" type="button" id="openTask">設定日期與提醒</button></form>
      <div class="filter-row" id="filters"><button class="filter active" data-filter="all">全部</button><button class="filter" data-filter="open">未完成</button><button class="filter" data-filter="done">已完成</button></div>
      <div class="task-list" id="taskList"></div>
      <div class="divider-label" id="laterLabel">接下來的活動</div><div class="task-list" id="upcomingList"></div>
    </section>
    <section id="calendarView" hidden>
      <div class="section-head"><h2>行程與截止日</h2><small>選擇日期查看安排</small></div>
      <div class="calendar-card" style="margin-top:15px">
        <div class="calendar-top"><h2 id="bigMonth"></h2><div class="month-arrows"><button id="prevBig" aria-label="上個月">‹</button><button id="nextBig" aria-label="下個月">›</button></div></div>
        <div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar-grid" id="bigGrid"></div>
      </div>
      <div class="section-head" style="margin-top:19px"><h2 id="selectedDateTitle">當日安排</h2><small id="selectedDateCount"></small></div><div class="task-list" id="calendarDayList"></div>
    </section>
  </main>
  <aside class="panel">
    <div class="calendar-card"><div class="calendar-top"><h2 id="miniMonth"></h2><div class="month-arrows"><button id="prevMonth" aria-label="上個月">‹</button><button id="nextMonth" aria-label="下個月">›</button></div></div><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar-grid" id="miniGrid"></div><div class="calendar-legend"><span><i class="legend-dot"></i>活動／截止日</span><span>點選日期快速查看</span></div></div>
    <div class="reminder-card"><div class="reminder-head"><strong>提醒事項</strong><span class="bell">♧</span></div><div id="reminderList"></div></div>
    <div class="tip-card"><strong>✦ 給自己的小提醒</strong><p id="dailyTip">完成一件小事，也值得為自己感到開心。</p></div>
  </aside>
</div>
<div class="modal-backdrop" id="modalBackdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">新增待辦</h2><button class="close" id="closeModal" aria-label="關閉">×</button></div><form id="itemForm"><div class="field"><label for="itemTitle">事項名稱</label><input id="itemTitle" required maxlength="100" placeholder="例如：寄出文件"></div><div class="field-grid"><div class="field"><label for="itemDate">日期（可留空，無日期待辦每天顯示）</label><input id="itemDate" type="date"></div><div class="field"><label for="itemTime">截止／開始時間（選填）</label><input id="itemTime" type="time"></div></div><div class="field" id="tagField"><label for="itemTag">標籤（選填）</label><input id="itemTag" maxlength="24" placeholder="例如：工作、生活"></div><div class="switch-row" id="reminderRow"><span>前一天提醒</span><input id="itemReminder" class="switch" type="checkbox" checked aria-label="前一天提醒"></div><div class="switch-row" id="allDayRow" hidden><span>整天活動</span><input id="itemAllDay" class="switch" type="checkbox" aria-label="整天活動"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelModal">取消</button><button type="submit" class="btn primary">儲存</button></div></form></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const now=new Date();now.setHours(0,0,0,0);const dateISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const shift=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};const todayISO=dateISO(now);const fmt=(s,opt={month:'long',day:'numeric'})=>new Intl.DateTimeFormat('zh-TW',opt).format(new Date(s+'T12:00:00'));const dow=d=>new Intl.DateTimeFormat('zh-TW',{weekday:'long'}).format(d);
  const seed=[
    {id:1,type:'task',title:'回覆 Mia 的設計提案',date:todayISO,time:'11:30',tag:'工作',reminder:false,done:false,created:todayISO,carry:0},
    {id:2,type:'task',title:'洗衣服',date:null,time:'',tag:'生活',reminder:false,done:false,created:todayISO,carry:0},
    {id:3,type:'task',title:'預約牙醫',date:todayISO,time:'',tag:'',reminder:false,done:false,created:dateISO(shift(now,-1)),carry:1},
    {id:4,type:'task',title:'整理報帳收據',date:dateISO(shift(now,1)),time:'',tag:'工作',reminder:true,done:false,created:todayISO,carry:0},
    {id:5,type:'task',title:'完成季度回顧',date:dateISO(shift(now,3)),time:'17:00',tag:'工作',reminder:true,done:false,created:todayISO,carry:0},
    {id:6,type:'event',title:'和 Sam 喝咖啡',date:todayISO,time:'15:00',allDay:false,done:false},
    {id:7,type:'event',title:'繳交專案企劃',date:dateISO(shift(now,2)),time:'',allDay:true,done:false},
    {id:8,type:'task',title:'寄出合約確認信',date:dateISO(shift(now,-2)),time:'',tag:'工作',reminder:false,done:true,created:dateISO(shift(now,-3)),carry:0}
  ];
  let data;try{data=JSON.parse(localStorage.getItem('daylight-items-v1'))||seed}catch{data=seed}let page='today',filter='all',view='tasks',selected=todayISO,month=new Date(now.getFullYear(),now.getMonth(),1),toastTimer;
  function persist(){localStorage.setItem('daylight-items-v1',JSON.stringify(data))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function normalize(){data.forEach(x=>{if(x.type==='task'&&!x.done&&x.date&&x.date<todayISO){const n=Math.max(1,Math.floor((now-new Date(x.date+'T12:00:00'))/86400000));x.date=todayISO;x.carry=(x.carry||0)+n}});persist()}
  function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
  function itemCard(x){const event=x.type==='event';let meta=event?(x.allDay?'整天活動':`${x.time||'未設定時間'} · 活動`):(x.time?`${x.time} · 截止`:(x.date?'截止 '+fmt(x.date,{month:'short',day:'numeric'}):'每日待辦'));if(x.date&&!event&&x.time)meta=`${fmt(x.date,{month:'short',day:'numeric'})} · ${x.time} 截止`;const cls=['task',x.done?'done':''].join(' ');const due=x.date===todayISO&&!event?'due':x.date<todayISO&&!event&&!x.done?'overdue':'';return `<article class="${cls}" data-id="${x.id}"><button class="check" aria-label="${x.done?'取消完成':'標記完成'}" data-action="toggle" data-id="${x.id}"></button><div class="task-body"><div class="task-title">${esc(x.title)}</div><div class="task-meta"><span class="${due}">${esc(meta)}</span>${x.carry?`<span class="carry">順延 ${x.carry} 天</span>`:''}</div></div><div class="task-tools">${x.tag?`<span class="tag">${esc(x.tag)}</span>`:''}<button class="more" aria-label="更多操作" data-action="edit" data-id="${x.id}">···</button></div></article>`}
  function renderTasks(){const tasks=data.filter(x=>x.type==='task');let main=page==='all'?tasks:tasks.filter(x=>!x.date||x.date<=todayISO||x.done);if(filter==='open')main=main.filter(x=>!x.done);if(filter==='done')main=main.filter(x=>x.done);main.sort((a,b)=>(a.done-b.done)||(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'').localeCompare(b.time||''));$('#taskList').innerHTML=main.length?main.map(itemCard).join(''):'<div class="empty">這裡還沒有待辦，先記下一件小事吧 ✦</div>';let upcoming=page==='all'?[]:data.filter(x=>x.type==='event'&&x.date>=todayISO).sort((a,b)=>a.date.localeCompare(b.date));$('#upcomingList').innerHTML=upcoming.length?upcoming.map(itemCard).join(''):'<div class="empty">目前沒有即將到來的活動</div>';$('#laterLabel').textContent=page==='all'?'':'接下來的活動';$('#laterLabel').hidden=page==='all';$('#upcomingList').hidden=page==='all';$('#taskSectionTitle').textContent=page==='all'?'所有待辦':'今天的待辦';$('#taskSummary').textContent=page==='all'?`${tasks.filter(x=>!x.done).length} 件尚未完成`:'未完成的事會自動順延到明天';$('#todayCount').textContent=tasks.filter(x=>!x.done&&(!x.date||x.date<=todayISO)).length;const done=tasks.filter(x=>x.done).length;$('#weekDone').textContent=done;$('#weekTotal').textContent=tasks.length;renderReminders()}
  function renderReminders(){const r=data.filter(x=>!x.done&&x.reminder&&x.date&&x.date>=todayISO).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);$('#reminderList').innerHTML=r.length?r.map(x=>`<div class="reminder-item"><span class="reminder-icon">◷</span><div><strong>${esc(x.title)}</strong><small>${fmt(x.date,{month:'short',day:'numeric'})} · 前一天提醒</small></div></div>`).join(''):'<div class="empty" style="padding:12px 4px;background:transparent">目前沒有已設定的提醒</div>'}
  function hasDate(d){return data.some(x=>x.date===d&&!x.done)}
  function grid(id,base,big=false){const first=new Date(base.getFullYear(),base.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());let html='';for(let i=0;i<42;i++){const d=shift(start,i),iso=dateISO(d),cls=['day',d.getMonth()!==base.getMonth()?'other':'',iso===todayISO?'today':'',iso===selected?'selected':'',hasDate(iso)?'has-event':''].join(' ');html+=`<button class="${cls}" data-date="${iso}" aria-label="${fmt(iso,{month:'long',day:'numeric'})}${hasDate(iso)?'，有安排':''}">${d.getDate()}</button>`}$(id).innerHTML=html}
  function renderCalendar(){const label=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long'}).format(month);$('#miniMonth').textContent=label;$('#bigMonth').textContent=label;grid('#miniGrid',month);grid('#bigGrid',month,true);const items=data.filter(x=>x.date===selected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));$('#selectedDateTitle').textContent=fmt(selected,{month:'long',day:'numeric'})+' 安排';$('#selectedDateCount').textContent=`${items.length} 項`;$('#calendarDayList').innerHTML=items.length?items.map(itemCard).join(''):'<div class="empty">這天還沒有安排，享受一點留白也很好。</div>'}
  function setPage(p){page=p;$$('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#crumb').textContent=p==='all'?'所有待辦':p==='calendar'?'行事曆':'今天';if(p==='calendar'){view='calendar';$('#taskView').hidden=true;$('#calendarView').hidden=false;$('#viewSwitch').hidden=true}else{view='tasks';$('#taskView').hidden=false;$('#calendarView').hidden=true;$('#viewSwitch').hidden=false}$('#pageTitle').textContent=p==='calendar'?'把日子，安排得剛剛好。':p==='all'?'所有待辦。':'今天，慢慢來。';$('#dateText').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);renderTasks();renderCalendar()}
  function openModal(type='task',item=null){$('#modalTitle').textContent=item?'編輯事項':type==='event'?'新增日曆活動':'新增待辦';$('#itemTitle').value=item?.title||'';$('#itemDate').value=item?.date||((type==='event')?selected:'');$('#itemTime').value=item?.time||'';$('#itemTag').value=item?.tag||'';$('#itemReminder').checked=item?.reminder??(type==='task');$('#itemAllDay').checked=item?.allDay||false;$('#itemForm').dataset.type=item?.type||type;$('#itemForm').dataset.id=item?.id||'';$('#tagField').hidden=type==='event'||item?.type==='event';$('#reminderRow').hidden=type==='event'||item?.type==='event';$('#allDayRow').hidden=type!=='event'&&item?.type!=='event';$('#itemTime').disabled=$('#itemAllDay').checked;$('#modalBackdrop').hidden=false;setTimeout(()=>$('#itemTitle').focus(),30)}function closeModal(){$('#modalBackdrop').hidden=true;$('#itemForm').reset()}
  $('#itemAllDay').addEventListener('change',e=>$('#itemTime').disabled=e.target.checked);$('#quickForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#quickInput').value.trim();if(!title)return;data.push({id:Date.now(),type:'task',title,date:null,time:'',tag:'',reminder:false,done:false,created:todayISO,carry:0});persist();$('#quickInput').value='';renderTasks();renderCalendar();toast('已加入今天的待辦')});$('#openTask').onclick=()=>openModal('task');$('#newEventBtn').onclick=()=>openModal('event');$('#closeModal').onclick=closeModal;$('#cancelModal').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
  $('#itemForm').addEventListener('submit',e=>{e.preventDefault();const title=$('#itemTitle').value.trim();if(!title)return;const id=$('#itemForm').dataset.id;const type=$('#itemForm').dataset.type;const prev=data.find(x=>String(x.id)===id);const value={id:prev?.id||Date.now(),type,title,date:$('#itemDate').value||null,time:$('#itemAllDay').checked?'':$('#itemTime').value,tag:type==='task'?$('#itemTag').value.trim():'',reminder:type==='task'&&$('#itemReminder').checked,allDay:type==='event'&&$('#itemAllDay').checked,done:prev?.done||false,created:prev?.created||todayISO,carry:prev?.carry||0};if(prev)Object.assign(prev,value);else data.push(value);persist();normalize();renderTasks();renderCalendar();closeModal();toast(prev?'已更新':'已儲存')});
  document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(btn){const x=data.find(y=>y.id==btn.dataset.id);if(!x)return;if(btn.dataset.action==='toggle'){x.done=!x.done;persist();renderTasks();renderCalendar();toast(x.done?'已完成，做得好！':'已恢復為未完成')}else if(btn.dataset.action==='edit')openModal(x.type,x);return}const d=e.target.closest('[data-date]');if(d){selected=d.dataset.date;const dt=new Date(selected+'T12:00:00');month=new Date(dt.getFullYear(),dt.getMonth(),1);renderCalendar();if(page==='calendar')return;toast(`已選擇 ${fmt(selected,{month:'long',day:'numeric'})}`)}});
  $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalBackdrop').hidden)closeModal()});$$('.filter').forEach(b=>b.onclick=()=>{$$('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;renderTasks()});$$('#viewSwitch button').forEach(b=>b.onclick=()=>{if(b.dataset.view==='calendar')setPage('calendar');else setPage('today')});function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);renderCalendar()}$('#prevMonth').onclick=()=>moveMonth(-1);$('#nextMonth').onclick=()=>moveMonth(1);$('#prevBig').onclick=()=>moveMonth(-1);$('#nextBig').onclick=()=>moveMonth(1);
  $('#notifyBtn').onclick=async()=>{if(!('Notification'in window)){toast('此瀏覽器不支援系統通知');return}try{const p=await Notification.requestPermission();if(p==='granted'){new Notification('日常提醒已開啟',{body:'前一天提醒會顯示在提醒事項中。'});toast('系統通知已啟用')}else toast('尚未允許通知；App 內提醒仍可使用')}catch{toast('請在安全連線（HTTPS）或 localhost 啟用通知')}};
  const tips=['完成一件小事，也值得為自己感到開心。','別忘了留一點時間，什麼也不做。','一步一步來，你已經在前進了。','把注意力放回眼前，一件事就好。'];$('#dailyTip').textContent=tips[now.getDate()%tips.length];normalize();setPage('today');
})();
</script>
